default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST") { "db" } %>
  username: <%= ENV.fetch("POSTGRES_USER") { "postgres" } %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") { "password" } %>
  port: 5432
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: music_and_magic_api_development

test:
  <<: *default
  database: music_and_magic_api_test

production:
  <<: *default
  database: music_and_magic_api_production
  username: music_and_magic_api
  password: <%= ENV["MAGIA_E_MUSICA_API_DATABASE_PASSWORD"] %>